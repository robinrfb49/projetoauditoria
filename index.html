<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Métricas Analíticas e Visão Geral - Labdiag</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-50%, 0, 0); } }
        .ticker-container { overflow: hidden; white-space: nowrap; }
        .ticker-conteudo { display: inline-block; animation: ticker 40s linear infinite; }
        .ticker-container:hover .ticker-conteudo { animation-play-state: paused; }
        .neon-text-green { text-shadow: 0 0 6px rgba(52, 211, 153, 0.6); }

        /* ANIMAÇÃO AVANÇADA DA LOGO DE LOGIN */
        @keyframes logoPulseGlow {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 15px rgba(37, 99, 235, 0.4), 0 0 30px rgba(37, 99, 235, 0.2);
            }
            50% {
                transform: scale(1.08);
                box-shadow: 0 0 25px rgba(37, 99, 235, 0.8), 0 0 50px rgba(59, 130, 246, 0.5);
            }
        }

        @keyframes logoShimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .logo-login-animada {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 50%, #3b82f6 100%);
            animation: logoPulseGlow 3s infinite ease-in-out;
            position: relative;
            overflow: hidden;
        }

        .logo-login-animada::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                60deg,
                transparent 30%,
                rgba(255, 255, 255, 0.35) 50%,
                transparent 70%
            );
            background-size: 200% 200%;
            animation: logoShimmer 3.5s infinite linear;
        }

        /* ESTILOS PARA O MENU LATERAL RETRÁTIL */
        .sidebar-transicao {
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s ease;
        }

        .menu-recolhido {
            width: 5rem !important; /* 80px */
            padding-left: 0.75rem !important;
            padding-right: 0.75rem !important;
        }

        .menu-recolhido .texto-menu,
        .menu-recolhido .rodape-menu-texto {
            display: none !important;
        }

        .menu-recolhido .item-menu-btn {
            justify-content: center !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
        }

        .menu-recolhido .logo-container {
            justify-content: center !important;
        }

        .monday-select { appearance: none; -webkit-appearance: none; text-align: center; font-weight: 800; color: white; cursor: pointer; transition: all 0.2s ease; border: none; }
        .status-working { background-color: #fdab3d; }
        .status-done { background-color: #00c875; }
        .status-stuck { background-color: #e2445c; }
        .status-backlog { background-color: #797e93; }
        
        .priority-high { background-color: #ef4444; }
        .priority-medium { background-color: #a25ddc; }
        .priority-low { background-color: #55596e; }

        .sticky-kpi-panel { position: sticky; top: 73px; z-index: 40; }

        /* REGRA EXCLUSIVA PARA IMPRESSÃO PERFEITA DO RELATÓRIO */
        @media print {
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            body { background: white !important; color: black !important; }
            .w-64, .w-20, header, .no-print, button, input, select { display: none !important; }
            .flex-1, #estrutura-sistema, #corpo-principal, main { width: 100% !important; max-width: 100% !important; padding: 0 !important; margin: 0 !important; overflow: visible !important; display: block !important; height: auto !important; }
            #aba-extrato { display: block !important; }
            #area-relatorio-extrato { border: none !important; shadow: none !important; padding: 0 !important; margin: 0 !important; }
            table { width: 100% !important; border-collapse: collapse !important; }
            th, td { border-bottom: 1px solid #cbd5e1 !important; }
            tfoot { display: table-footer-group !important; }
        }
    </style>
</head>
<body class="bg-slate-900 font-sans text-slate-800 min-h-screen flex items-center justify-center m-0" id="corpo-principal">

    <!-- TELA DE LOGIN COM LOGO ANIMADA -->
    <div id="bloco-autenticacao" class="w-full max-w-md mx-4 transition-all duration-300 block">
        <div class="bg-white p-8 rounded-2xl shadow-2xl border border-slate-800/10">
            <div class="text-center mb-8">
                <!-- LOGO ANIMADA LD -->
                <div class="logo-login-animada text-white font-black text-2xl w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4 tracking-tighter cursor-pointer select-none">
                    <span class="relative z-10 drop-shadow-md">LD</span>
                </div>
                <h2 class="text-2xl font-black text-slate-900 tracking-tight">Acesso ao Labdiag</h2>
                <p class="text-sm text-slate-400 mt-1">Área estritamente restrita a administradores</p>
            </div>
            <form id="form-login" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Usuário</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                        <input type="text" id="login-user" value="admin" required class="w-full pl-10 pr-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-blue-500 bg-slate-50">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Senha</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                        <input type="password" id="login-pass" value="1234" required class="w-full pl-10 pr-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-blue-500 bg-slate-50">
                    </div>
                </div>
                <div id="erro-autenticacao" class="text-red-500 text-xs font-bold hidden text-center bg-red-50 py-2 rounded-lg border border-red-100 animate-pulse">
                    <i class="fa-solid fa-triangle-exclamation"></i> Credenciais incorretas. Acesso negado.
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-sm hover:bg-blue-700 transition-all cursor-pointer shadow-md mt-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Verificar e Entrar
                </button>
            </form>
        </div>
    </div>

    <!-- CONTAINER PRINCIPAL DO SISTEMA -->
    <div id="estrutura-sistema" class="w-full h-screen flex overflow-hidden hidden bg-slate-50"></div>

    <template id="template-admin">
        <!-- MENU LATERAL RETRÁTIL -->
        <div id="menu-lateral" class="w-64 bg-slate-900 text-white flex flex-col justify-between p-5 border-r border-slate-800 no-print shrink-0 sidebar-transicao">
            <div>
                <!-- CABEÇALHO DO MENU COM BOTÃO RETRÁTIL -->
                <div class="flex items-center justify-between gap-3 mb-8 logo-container">
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="bg-blue-600 p-2 rounded-lg text-white font-bold text-xl shadow-md shrink-0">LD</div>
                        <span class="text-lg font-bold tracking-wider texto-menu truncate">LABDIAG</span>
                    </div>
                    <button onclick="toggleMenuRetratil()" class="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-800 transition-all cursor-pointer shrink-0" title="Recolher/Expandir Menu">
                        <i id="icone-toggle-menu" class="fa-solid fa-angles-left text-sm"></i>
                    </button>
                </div>

                <!-- NAV COM ITENS -->
                <nav class="space-y-2">
                    <button onclick="alternarAba('aba-dashboard')" id="btn-aba-dashboard" class="w-full flex items-center gap-3 bg-slate-800 text-blue-400 px-4 py-3 rounded-lg font-medium text-left cursor-pointer item-menu-btn" title="Dashboard Central">
                        <i class="fa-solid fa-chart-pie w-5 shrink-0 text-center"></i> 
                        <span class="texto-menu truncate">Dashboard Central</span>
                    </button>
                    <button onclick="alternarAba('aba-tarefas')" id="btn-aba-tarefas" class="w-full flex items-center gap-3 text-slate-400 hover:bg-slate-800 hover:text-white px-4 py-3 rounded-lg font-medium text-left transition-all cursor-pointer item-menu-btn" title="Quadro de Tarefas">
                        <i class="fa-solid fa-list-check w-5 shrink-0 text-center"></i> 
                        <span class="texto-menu truncate">Quadro de Tarefas</span>
                    </button>
                    <button onclick="alternarAba('aba-contas')" id="btn-aba-contas" class="w-full flex items-center gap-3 text-slate-400 hover:bg-slate-800 hover:text-white px-4 py-3 rounded-lg font-medium text-left transition-all cursor-pointer item-menu-btn" title="Lançar Faturas">
                        <i class="fa-solid fa-file-invoice-dollar w-5 shrink-0 text-center"></i> 
                        <span class="texto-menu truncate">Lançar Faturas</span>
                    </button>
                    <button onclick="alternarAba('aba-extrato')" id="btn-aba-extrato" class="w-full flex items-center gap-3 text-slate-400 hover:bg-slate-800 hover:text-white px-4 py-3 rounded-lg font-medium text-left transition-all cursor-pointer item-menu-btn" title="Extrato de Auditoria">
                        <i class="fa-solid fa-file-signature w-5 shrink-0 text-center"></i> 
                        <span class="texto-menu truncate">Extrato de Auditoria</span>
                    </button>
                    <button onclick="alternarAba('aba-repasse')" id="btn-aba-repasse" class="w-full flex items-center gap-3 text-slate-400 hover:bg-slate-800 hover:text-white px-4 py-3 rounded-lg font-medium text-left transition-all cursor-pointer item-menu-btn" title="Análise de Repasse">
                        <i class="fa-solid fa-scale-balanced w-5 shrink-0 text-center"></i> 
                        <span class="texto-menu truncate">Análise de Repasse</span>
                    </button>
                    
                    <input type="file" id="input-importar-json" accept=".json" onchange="processarImportacaoJson(event)" class="hidden">
                    <button onclick="document.getElementById('input-importar-json').click()" class="w-full flex items-center gap-3 text-blue-400 hover:bg-blue-950/40 hover:text-blue-300 px-4 py-3 rounded-lg font-medium text-left transition-all cursor-pointer mt-4 border border-blue-800/40 bg-blue-950/10 item-menu-btn" title="Importar DB.json">
                        <i class="fa-solid fa-upload w-5 shrink-0 text-center"></i> 
                        <span class="texto-menu truncate">Importar DB.json</span>
                    </button>
                    <button onclick="exportarJson()" class="w-full flex items-center gap-3 text-emerald-400 hover:bg-emerald-950/40 hover:text-emerald-300 px-4 py-3 rounded-lg font-medium text-left transition-all cursor-pointer mt-2 border border-emerald-800/40 bg-emerald-950/10 item-menu-btn" title="Exportar DB.json">
                        <i class="fa-solid fa-download w-5 shrink-0 text-center"></i> 
                        <span class="texto-menu truncate">Exportar DB.json</span>
                    </button>
                    <button onclick="logout()" class="w-full flex items-center gap-3 text-red-400 hover:bg-red-950/40 hover:text-red-300 px-4 py-3 rounded-lg font-medium transition-all mt-8 border-t border-slate-800/60 pt-4 text-left cursor-pointer item-menu-btn" title="Sair com Segurança">
                        <i class="fa-solid fa-arrow-right-from-bracket w-5 shrink-0 text-center"></i> 
                        <span class="texto-menu truncate">Sair com Segurança</span>
                    </button>
                </nav>
            </div>
            <div class="text-sm text-slate-500 rodape-menu-texto truncate">v6.5.0 • Strategic Intelligence</div>
        </div>

        <!-- CORPO PRINCIPAL -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white border-b border-slate-200 px-8 py-5 flex justify-between items-center shadow-sm sticky top-0 z-50 no-print shrink-0">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900" id="titulo-pagina">Métricas Analíticas e Visão Geral</h1>
                    <p class="text-sm text-slate-500" id="subtitulo-pagina">Painel integrado de gestão hospitalar - Labdiag</p>
                </div>
                <div class="w-10 h-10 bg-blue-100 text-blue-600 font-semibold rounded-full flex items-center justify-center border border-blue-200 shrink-0">RF</div>
            </header>

            <main class="p-8 space-y-6 max-w-7xl w-full mx-auto flex-1">
                
                <!-- DASHBOARD CENTRAL -->
                <div id="aba-dashboard" class="space-y-6 secao-sistema block">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 auto-rows-fr">
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-md h-28 flex flex-col justify-between">
                            <p class="text-xs font-semibold text-slate-400 uppercase">Total Acordado</p>
                            <h3 class="text-lg font-bold text-slate-900 mt-1" id="dash-apagar">R$ 0,00</h3>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-md h-28 flex flex-col justify-between">
                            <p class="text-xs font-semibold text-slate-400 uppercase">Total Glosado</p>
                            <h3 class="text-lg font-bold text-slate-900 mt-1" id="dash-auditado">R$ 0,00</h3>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-md h-28 flex flex-col justify-between">
                            <p class="text-xs font-semibold text-slate-400 uppercase">Total Pago Líquido</p>
                            <h3 class="text-lg font-bold text-slate-900 mt-1" id="dash-pago">R$ 0,00</h3>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-emerald-200 shadow-md bg-gradient-to-br from-emerald-50 to-white h-28 flex flex-col justify-between">
                            <p class="text-xs font-semibold text-emerald-700 uppercase">Total Recuperado</p>
                            <h3 class="text-lg font-bold text-emerald-600 mt-1" id="dash-recuperado">R$ 0,00</h3>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-red-200 shadow-md bg-gradient-to-br from-red-50 to-white h-28 flex flex-col justify-between">
                            <p class="text-xs font-semibold text-red-700 uppercase">Perda MatMed Total</p>
                            <h3 class="text-lg font-bold text-red-600 mt-1" id="dash-perda-matmed">R$ 0,00</h3>
                        </div>
                    </div>

                    <div class="bg-black border-y-2 border-blue-600 text-white text-xl font-mono py-4 tracking-wider ticker-container shadow-lg rounded-xl select-none">
                        <div class="ticker-conteudo flex items-center space-x-24" id="letreiro-bolsa"><span>Sincronizando lotes...</span></div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                            <div class="bg-blue-50 text-blue-600 p-3 rounded-xl shrink-0"><i class="fa-solid fa-percent text-lg"></i></div>
                            <div><p class="text-[11px] font-bold text-slate-400 uppercase">Índice de Glosa</p><h4 class="text-base font-black text-slate-900" id="card-idx-glosa">0.0%</h4></div>
                        </div>
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                            <div class="bg-amber-50 text-amber-600 p-3 rounded-xl shrink-0"><i class="fa-solid fa-hourglass-half text-lg"></i></div>
                            <div><p class="text-[11px] font-bold text-slate-400 uppercase">Atraso Médio</p><h4 class="text-base font-black text-slate-900" id="card-atraso">0 dias</h4></div>
                        </div>
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                            <div class="bg-purple-50 text-purple-600 p-3 rounded-xl shrink-0"><i class="fa-solid fa-receipt text-lg"></i></div>
                            <div><p class="text-[11px] font-bold text-slate-400 uppercase">Ticket Médio / Conta</p><h4 class="text-base font-black text-slate-900" id="card-ticket">R$ 0,00</h4></div>
                        </div>
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                            <div class="bg-slate-50 text-slate-600 p-3 rounded-xl shrink-0"><i class="fa-solid fa-folder-open text-lg"></i></div>
                            <div><p class="text-[11px] font-bold text-slate-400 uppercase">Faturas em Aberto</p><h4 class="text-base font-black text-slate-900" id="card-abertas">0 faturas</h4></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center justify-center relative h-64">
                            <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-2">Meta Operacional: Eficiência de Glosa</h3>
                            <div class="w-full max-w-[240px] h-32 relative"><canvas id="gaugeGlosa"></canvas><div class="absolute inset-x-0 bottom-0 flex flex-col items-center justify-center"><span class="text-2xl font-black text-slate-900" id="txt-gauge-glosa">0.0%</span></div></div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center justify-center relative h-64">
                            <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-2">Meta de Liquidação: Repasses Pagos</h3>
                            <div class="w-full max-w-[240px] h-32 relative"><canvas id="gaugePago"></canvas><div class="absolute inset-x-0 bottom-0 flex flex-col items-center justify-center"><span class="text-2xl font-black text-slate-900" id="txt-gauge-pago">0.0%</span></div></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm lg:col-span-2 h-80">
                            <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4">Evolução Mensal: Cobrado x Liberado</h3>
                            <div class="h-56 relative"><canvas id="graficoEvolucao"></canvas></div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col items-center h-80">
                            <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4 w-full text-left">Representatividade por Status</h3>
                            <div class="h-56 w-full relative"><canvas id="graficoDonutStatusGeral"></canvas></div>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4"><i class="fa-solid fa-list-check text-blue-600 mr-1"></i> Últimas Atividades Processadas</h3>
                        <div class="overflow-x-auto w-full">
                            <table class="w-full text-left text-xs">
                                <thead>
                                    <tr class="bg-slate-100 text-slate-500 font-bold uppercase text-[10px] border-b border-slate-200">
                                        <th class="py-2.5 px-4">Prestador</th>
                                        <th class="py-2.5 px-4 text-center">Competência</th>
                                        <th class="py-2.5 px-4 text-right">Faturado</th>
                                        <th class="py-2.5 px-4 text-right">Glosa (Auditado)</th>
                                        <th class="py-2.5 px-4 text-center">Status</th>
                                    </tr>
                                </thead>
                                <tbody id="dash-movimentacoes" class="divide-y divide-slate-100 font-medium text-slate-700"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- QUADRO DE TAREFAS -->
                <div id="aba-tarefas" class="space-y-6 secao-sistema hidden">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs text-center">
                            <div class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Demandas Ativas</div>
                            <div class="text-xl font-extrabold text-slate-900" id="kpi-task-total">0</div>
                        </div>
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs text-center">
                            <div class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Gargalos / Travados</div>
                            <div class="text-xl font-extrabold text-red-500" id="kpi-task-stuck">0</div>
                        </div>
                        <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-100 shadow-xs text-center">
                            <div class="text-[10px] uppercase font-bold text-emerald-600 tracking-wider">Eficiência de Entrega</div>
                            <div class="text-xl font-extrabold text-emerald-600" id="kpi-task-progress">0%</div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col items-center justify-center relative min-h-[180px]">
                            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 text-center w-full">Velocímetro de Eficiência</h4>
                            <div class="w-full max-w-[200px] h-28 relative">
                                <canvas id="gaugeTaskProgress"></canvas>
                                <div class="absolute inset-x-0 bottom-0 flex flex-col items-center justify-center">
                                    <span class="text-xl font-black text-slate-900" id="txt-gauge-task-progress">0%</span>
                                </div>
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm min-h-[180px] flex flex-col justify-between">
                            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 w-full">Produtividade por Profissional</h4>
                            <div class="h-32 w-full relative"><canvas id="chartTaskProdutividade"></canvas></div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm min-h-[180px] flex flex-col justify-between">
                            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 w-full">Demandas por Instância</h4>
                            <div class="h-32 w-full relative"><canvas id="chartTaskInstancia"></canvas></div>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-md space-y-5">
                        <form id="form-tarefa" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <div class="lg:col-span-2">
                                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-0.5">Descrição da Atividade</label>
                                <input type="text" id="add-task-nome" required placeholder="Ex: Conciliação de glosa de materiais..." class="w-full px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-medium focus:outline-blue-500">
                            </div>
                            <div>

                    carregarDadosCompletos();

                }, 100);
            };

        window.alternarAba = function(idAba) {
            document.querySelectorAll('.secao-sistema').forEach(s => s.classList.add('hidden'));

            });
            carregarDadosCompletos();
        };

        function carregarDadosCompletos() {
            const db = JSON.parse(localStorage.getItem('db.json'));
            todasContasLocais = db.ultimas_contas || [];
            
            let totalFaturado = 0, totalGlosaRetido = 0, totalAcordadoPagar = 0;
            let totalAtraso = 0, qtdComAtraso = 0, totalValorPagoLiquido = 0;
            let totalRecuperadoAuditoria = 0, totalPerdaMatMed = 0;
            let contagemStatus = { "A Pagar": 0, "Auditada": 0, "Paga": 0 };

            todasContasLocais.forEach(c => {
                const fat = Math.round((parseFloat(c.valor_faturado) || 0) * 100) / 100;
                let aud = Math.round((parseFloat(c.valor_auditado) || 0) * 100) / 100;
                let acordo = Math.round((fat - aud) * 100) / 100;
                
                if (c.valor_acordo !== undefined) acordo = Math.round((parseFloat(c.valor_acordo) || 0) * 100) / 100;
                else if (c.valor_repasse !== undefined) acordo = Math.round((parseFloat(c.valor_repasse) || 0) * 100) / 100;

                const matmedTotal = Math.round((parseFloat(c.valor_matmed_total) || 0) * 100) / 100;
                
                totalFaturado += fat;
                totalAcordadoPagar += acordo;
                totalGlosaRetido += aud; 
                totalRecuperadoAuditoria += (fat - acordo);
                totalPerdaMatMed += matmedTotal;

                if (c.status === "Paga" || c.status === "Pago") {
                    totalValorPagoLiquido += acordo;
                }
                if(c.atraso) {
                    totalAtraso += parseInt(c.atraso);
                    qtdComAtraso++;
                }
                if(contagemStatus[c.status] !== undefined) contagemStatus[c.status]++;
            });

            const idxGlosaGeral = totalFaturado > 0 ? ((totalGlosaRetido / totalFaturado) * 100) : 0;
            const mediaAtraso = qtdComAtraso > 0 ? Math.round(totalAtraso / qtdComAtraso) : 0;
            const ticketMedio = todasContasLocais.length > 0 ? (totalFaturado / todasContasLocais.length) : 0;
            const percentualPago = totalAcordadoPagar > 0 ? ((totalValorPagoLiquido / totalAcordadoPagar) * 100) : 0;

            const mapeamentoValores = {
                'dash-apagar': totalAcordadoPagar, 'anexo-apagar': totalAcordadoPagar,
                'dash-auditado': totalGlosaRetido, 'anexo-auditado': totalGlosaRetido,
                'dash-pago': totalValorPagoLiquido, 'anexo-pago': totalValorPagoLiquido,
                'dash-recuperado': totalRecuperadoAuditoria, 'anexo-recuperado': totalRecuperadoAuditoria,
                'dash-perda-matmed': totalPerdaMatMed
            };

            for(let [id, val] of Object.entries(mapeamentoValores)){
                let el = document.getElementById(id);
                if(el) el.innerText = 'R$ ' + val.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            }

            if(document.getElementById('card-idx-glosa')) document.getElementById('card-idx-glosa').innerText = idxGlosaGeral.toFixed(1) + '%';
            if(document.getElementById('card-atraso')) document.getElementById('card-atraso').innerText = mediaAtraso + ' dias';
            if(document.getElementById('card-ticket')) document.getElementById('card-ticket').innerText = 'R$ ' + ticketMedio.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            if(document.getElementById('card-abertas')) document.getElementById('card-abertas').innerText = contagemStatus['A Pagar'] + ' faturas';

            let stringTicker = "";
            todasContasLocais.slice(0, 5).forEach(c => {
                stringTicker += `<span class="inline-flex items-center space-x-2"><span class="text-slate-300 font-bold uppercase">${c.prestador}:</span><span class="text-emerald-400 font-medium neon-text-green">▲ COBRADO R$ ${parseFloat(c.valor_faturado || 0).toLocaleString('pt-BR', {maximumFractionDigits:0})}</span></span> &nbsp;&nbsp;&nbsp;&nbsp;`;
            });
            if(document.getElementById('letreiro-bolsa')) document.getElementById('letreiro-bolsa').innerHTML = stringTicker || "<span>Painel sincronizado.</span>";

            renderizarGauges(idxGlosaGeral, percentualPago);
            renderizarGraficosCompletos(contagemStatus, totalAcordadoPagar, totalGlosaRetido, totalValorPagoLiquido);
            renderizarTabelaHistorial();
            filtrarExtratoExclusivo();
        }

        function vincularCalculoAutomatico() {
            const faturado = document.getElementById('form-faturado');
            const auditado = document.getElementById('form-auditado');
            const acordo = document.getElementById('form-acordo');
            if(!faturado || !auditado) return;
            const calc = () => { acordo.value = (Math.max(0, (parseFloat(faturado.value) || 0) - (parseFloat(auditado.value) || 0))).toFixed(2); };
            faturado.addEventListener('input', calc);
            auditado.addEventListener('input', calc);
        }

        function renderizarGauges(glosa, pago) {
            if(!window.Chart || !document.getElementById('gaugeGlosa')) return;
            const opt = { responsive: true, maintainAspectRatio: false, rotation: -90, circumference: 180, plugins: { legend: { display: false } }, cutout: '80%' };
            
            if (gaugeChartGlosa) gaugeChartGlosa.destroy();
            gaugeChartGlosa = new Chart(document.getElementById('gaugeGlosa').getContext('2d'), { type: 'doughnut', data: { datasets: [{ data: [glosa, Math.max(0, 100 - glosa)], backgroundColor: ['#3b82f6', '#e2e8f0'], borderWidth: 0 }] }, options: opt });
            if(document.getElementById('txt-gauge-glosa')) document.getElementById('txt-gauge-glosa').innerText = glosa.toFixed(1) + '%';

            if (gaugeChartPago) gaugeChartPago.destroy();
            gaugeChartPago = new Chart(document.getElementById('gaugePago').getContext('2d'), { type: 'doughnut', data: { datasets: [{ data: [pago, Math.max(0, 100 - pago)], backgroundColor: ['#10b981', '#e2e8f0'], borderWidth: 0 }] }, options: opt });
            if(document.getElementById('txt-gauge-pago')) document.getElementById('txt-gauge-pago').innerText = pago.toFixed(1) + '%';
        }

        function renderizarGraficosCompletos(stData, apagar, auditado, pago) {
            if(!window.Chart) return;
            if(document.getElementById('graficoEvolucao')){
                if (chartEvolucao) chartEvolucao.destroy();
                chartEvolucao = new Chart(document.getElementById('graficoEvolucao').getContext('2d'), { type: 'line', data: { labels: ['Histórico Inicial', 'Competência Corrente'], datasets: [{ label: 'Cobrado', data: [124003, apagar + auditado], borderColor: '#cbd5e1', fill: false }, { label: 'Liberado', data: [112842, apagar], borderColor: '#2563eb', fill: true }] }, options: { responsive: true, maintainAspectRatio: false } });
            }

        function processarPlanilhaRepasse(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const rawJson = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: "" });

                analisarDadosRepasse(rawJson);
            };
            reader.readAsArrayBuffer(file);
        }

        function analisarDadosRepasse(rows) {
            if (!rows || rows.length === 0) {
                alert("O arquivo importado não contém registros.");
                return;
            }

            const parseMoeda = (val) => {
                if (typeof val === 'number') return isNaN(val) ? 0 : val;
                if (!val) return 0;
                let str = String(val).trim().replace(/R\$/g, '').replace(/\s/g, '');
                if (str.includes(',')) {
                    str = str.replace(/\./g, '').replace(',', '.');
                }
                return parseFloat(str) || 0;
            };

            dadosRepasseFormatados = rows.map((r, i) => {
                const obterValorColuna = (nomesPossiveis) => {
                    const chaves = Object.keys(r);
                    for (let nome of nomesPossiveis) {
                        const chaveEncontrada = chaves.find(k => 
                            k.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "") === 
                            nome.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                        );
                        if (chaveEncontrada && r[chaveEncontrada] !== undefined && r[chaveEncontrada] !== null && r[chaveEncontrada] !== "") {
                            return String(r[chaveEncontrada]).trim();
                        }
                    }
                    return null;
                };

                const competencia = obterValorColuna(['CompetênC15+A', 'Competencia', 'COMPETENCIA', 'MES_ANO', 'DT_COMPETENCIA']) || '-';
                const atendimento = obterValorColuna(['Atendiment', 'Atendimento', 'Conta', 'CD_ATENDIMENTO', 'ATENDIMENTO', 'NR_ATENDIMENTO']) || `${i+1}`;
                const paciente = obterValorColuna(['Paciente', 'PACIENTE', 'NM_PACIENTE', 'NOME PACIENTE', 'NOME_PACIENTE', 'NOME DO PACIENTE']) || 'PACIENTE NÃO INFORMADO';
                const convenio = obterValorColuna(['Convênio', 'Convenio', 'CONVENIO', 'Plano', 'NM_CONVENIO', 'DS_CONVENIO']) || 'CONVÊNIO NÃO INFORMADO';
                const codFat = obterValorColuna(['Cód. Fat', 'COD_FAT', 'Cod Fat', 'Código', 'CD_PROCEDIMENTO', 'COD_PROCEDIMENTO']) || '-';
                const descricao = obterValorColuna(['Descrição Fat.', 'Procedimento', 'Item', 'Descricao Fat', 'DS_PROCEDIMENTO', 'DESCRICAO']) || `Item ${i+1}`;
                const qtd = parseMoeda(obterValorColuna(['Qtde. Mov', 'Qtd', 'Quantidade', 'QT_LANCAMENTO', 'QTDE']) || 1);
                
                const receitaLancamento = parseMoeda(obterValorColuna([
                    'Receita Lançamento', 'Receita Lancamento', 'RECEITA LANÇAMENTO', 
                    'Receita_Lancamento', 'Valor Lançado', 'Valor Cobrado', 'VL_LANÇAMENTO', 'VL_LANCTO'
                ]));
                
                const valorTabela = parseMoeda(obterValorColuna([
                    'VLR_TAB1,5', 'VLR_TAB1.5', 'Valor Tabela', 'Vlr Tabela', 'VL_TABELA', 'VALOR_TABELA'
                ]));
                
                let vlrDif = parseMoeda(obterValorColuna([
                    'VLR_DIF:', 'VLR_DIF', 'Diferença', 'Diferenca', 'VL_GLOSA', 'VL_DIFERENCA'
                ]));

                if (vlrDif === 0 && receitaLancamento > 0 && valorTabela > 0 && receitaLancamento !== valorTabela) {
                    vlrDif = receitaLancamento - valorTabela;
                }

                const grupo = obterValorColuna(['Grupo Faturamento', 'GRUPO_FATURAMENTO', 'Grupo', 'DS_GRUPO', 'GRUPO']) || 'DIVERSOS';
                const setor = obterValorColuna(['Setor', 'SETOR', 'DS_SETOR', 'UNIDADE']) || 'GERAL';
                const laudoStatus = obterValorColuna(['Laudo', 'DS_LAUDO', 'Status Laudo', 'Laudo Identificado', 'ST_LAUDO']) || 'NÃO IDENTIFICADO';
                const dsAuditoria = obterValorColuna(['DS_AUDITORIA', 'Status Auditoria', 'ST_AUDITORIA']) || (vlrDif > 0 ? 'VLR_AUDITADO' : 'SEM_GLOSA');

                return {
                    competencia,
                    atendimento,
                    paciente,
                    convenio,
                    codFat,
                    descricao,
                    qtd,
                    receitaLancamento,
                    valorTabela,
                    vlrDif: Math.abs(vlrDif),
                    grupo,
                    setor,
                    laudoStatus,
                    dsAuditoria
                };
            });

            popularFiltrosPaciente(dadosRepasseFormatados);
            executarFiltroCruzadoGlobal();
        }

        function executarFiltroCruzadoGlobal() {
            if (!dadosRepasseFormatados || dadosRepasseFormatados.length === 0) return;

            const nomePaciente = document.getElementById('filtro-repasse-paciente')?.value.toLowerCase().trim() || '';
            const setorSel = document.getElementById('filtro-repasse-setor')?.value || 'TODOS';
            const grupoSel = document.getElementById('filtro-repasse-grupo')?.value || 'TODOS';

            const barraFiltro = document.getElementById('barra-status-filtro-ativo');
            const lblFiltro = document.getElementById('lbl-filtro-detalhe');
            let detalhesFiltro = [];
            if (grupoSel !== 'TODOS') detalhesFiltro.push(`Grupo: ${grupoSel}`);
            if (setorSel !== 'TODOS') detalhesFiltro.push(`Setor: ${setorSel}`);
            if (nomePaciente !== '') detalhesFiltro.push(`Paciente: "${nomePaciente}"`);

            if (detalhesFiltro.length > 0) {
                if (barraFiltro) barraFiltro.classList.remove('hidden');
                if (lblFiltro) lblFiltro.innerText = detalhesFiltro.join(' | ');
            } else {
                if (barraFiltro) barraFiltro.classList.add('hidden');
            }

            const dadosFiltrados = dadosRepasseFormatados.filter(d => {
                const batePaciente = nomePaciente === '' || (d.paciente && d.paciente.toLowerCase().includes(nomePaciente));
                const bateSetor = (setorSel === 'TODOS') || (d.setor === setorSel);
                const bateGrupo = (grupoSel === 'TODOS') || (d.grupo === grupoSel);
                return batePaciente && bateSetor && bateGrupo;
            });

            renderizarDashboardRepasseFiltrado(dadosFiltrados);
        }

        function renderizarDashboardRepasseFiltrado(dados) {
            let totReceita = 0;
            let totTabela = 0;
            let totAuditado = 0;

            const gruposAuditadosMap = {};
            const contasSet = new Set();
            
            const mapPacientes = {};
            const mapConvenios = {};
            const mapSetores = {};
            const mapProdutosCobrados = {};
            const mapProdutosGlosados = {};
            let laudosOk = 0, laudosPendentes = 0;

            dados.forEach(d => {
                totReceita += d.receitaLancamento;
                totTabela += d.valorTabela;
                if (d.atendimento) contasSet.add(d.atendimento);

                const statusAuditoria = String(d.dsAuditoria || '').trim().toUpperCase();
                const ehAuditado = statusAuditoria.includes('VLR_AUDITADO') || d.vlrDif > 0;

                if (ehAuditado) {
                    totAuditado += d.vlrDif;
                    gruposAuditadosMap[d.grupo] = (gruposAuditadosMap[d.grupo] || 0) + d.vlrDif;
                }

                mapPacientes[d.paciente] = (mapPacientes[d.paciente] || 0) + d.receitaLancamento;
                mapSetores[d.setor] = (mapSetores[d.setor] || 0) + d.receitaLancamento;

                if (!mapConvenios[d.convenio]) {
                    mapConvenios[d.convenio] = { valorTotal: 0, glosaTotal: 0, contas: new Set() };
                }
                mapConvenios[d.convenio].valorTotal += d.receitaLancamento;
                if (ehAuditado) mapConvenios[d.convenio].glosaTotal += d.vlrDif;
                mapConvenios[d.convenio].contas.add(d.atendimento);

                const stLaudo = String(d.laudoStatus || '').toUpperCase();
                if (stLaudo.includes('SIM') || stLaudo.includes('OK') || stLaudo.includes('CONCLUÍDO') || stLaudo.includes('IDENTIFICADO')) {
                    laudosOk++;
                } else {
                    laudosPendentes++;
                }

                const chaveItem = `${d.codFat} - ${d.descricao}`;
                if (!mapProdutosCobrados[chaveItem]) {
                    mapProdutosCobrados[chaveItem] = { freq: 0, valor: 0 };
                }
                mapProdutosCobrados[chaveItem].freq += d.qtd;
                mapProdutosCobrados[chaveItem].valor += d.receitaLancamento;

                if (ehAuditado) {
                    if (!mapProdutosGlosados[chaveItem]) {
                        mapProdutosGlosados[chaveItem] = { freq: 0, glosa: 0 };
                    }
                    mapProdutosGlosados[chaveItem].freq += d.qtd;
                    mapProdutosGlosados[chaveItem].glosa += d.vlrDif;
                }
            });

            const totalContas = contasSet.size || dados.length;
            const mediaGlosaPct = totReceita > 0 ? ((totAuditado / totReceita) * 100) : 0;
            const ticketMedioConta = totalContas > 0 ? (totReceita / totalContas) : 0;

            let grupoTop = "-";
            let maiorGlosaGrupo = 0;
            Object.entries(gruposAuditadosMap).forEach(([grp, val]) => {
                if (val > maiorGlosaGrupo) {
                    maiorGlosaGrupo = val;
                    grupoTop = grp;
                }
            });

            nomeGrupoMaisAuditadoTop = grupoTop;

            document.getElementById('rep-kpi-receita').innerText = 'R$ ' + totReceita.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('rep-kpi-tabela').innerText = 'R$ ' + totTabela.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('rep-kpi-auditado').innerText = 'R$ ' + totAuditado.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('rep-kpi-grupo-top').innerText = grupoTop !== "-" ? `${grupoTop} (R$ ${maiorGlosaGrupo.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2})})` : "-";
            document.getElementById('rep-kpi-laudos-pendentes').innerText = `${laudosPendentes} itens`;
            document.getElementById('rep-total-registros').innerText = `${dados.length} itens em ${totalContas} contas`;

        function renderizarVelocimetrosRepasse(glosaPct, ticket, contas) {
            if (!window.Chart) return;

            const optGauge = {
                responsive: true,
                maintainAspectRatio: false,
                rotation: -90,
                circumference: 180,
                plugins: { legend: { display: false } },
                cutout: '80%'
            };

            if (gaugeRepasseGlosaInst) gaugeRepasseGlosaInst.destroy();
            if (document.getElementById('gaugeRepasseGlosa')) {
                gaugeRepasseGlosaInst = new Chart(document.getElementById('gaugeRepasseGlosa').getContext('2d'), {
                    type: 'doughnut',
                    data: {
                        datasets: [{
                            data: [glosaPct, Math.max(0, 100 - glosaPct)],
                            backgroundColor: ['#ef4444', '#e2e8f0'],
                            borderWidth: 0
                        }]
                    },
                    options: optGauge
                });
            }

            const tktEscala = Math.min(100, (ticket / 5000) * 100);
            if (gaugeRepasseTicketInst) gaugeRepasseTicketInst.destroy();
            if (document.getElementById('gaugeRepasseTicket')) {
                gaugeRepasseTicketInst = new Chart(document.getElementById('gaugeRepasseTicket').getContext('2d'), {
                    type: 'doughnut',
                    data: {
                        datasets: [{
                            data: [tktEscala, Math.max(0, 100 - tktEscala)],
                            backgroundColor: ['#3b82f6', '#e2e8f0'],
                            borderWidth: 0
                        }]
                    },
                    options: optGauge
                });
            }

            const contasEscala = Math.min(100, (contas / 500) * 100);
            if (gaugeRepasseContasInst) gaugeRepasseContasInst.destroy();
            if (document.getElementById('gaugeRepasseContas')) {
                gaugeRepasseContasInst = new Chart(document.getElementById('gaugeRepasseContas').getContext('2d'), {
                    type: 'doughnut',
                    data: {
                        datasets: [{
                            data: [contasEscala, Math.max(0, 100 - contasEscala)],
                            backgroundColor: ['#10b981', '#e2e8f0'],
                            borderWidth: 0
                        }]
                    },
                    options: optGauge
                });
            }
        }

        function renderizarGraficosRepasse(gruposAuditadosMap, totReceita, totAuditado) {
            if (!window.Chart) return;

            const ordenados = Object.entries(gruposAuditadosMap).sort((a,b) => b[1] - a[1]);
            const labelsG = ordenados.map(x => x[0]);
            const dataG = ordenados.map(x => x[1]);

            if (chartRepasseGrupoInst) chartRepasseGrupoInst.destroy();
            const elGroup = document.getElementById('chartRepasseGrupo');
            if (elGroup) {
                chartRepasseGrupoInst = new Chart(elGroup.getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: labelsG.length > 0 ? labelsG : ['Sem Dados'],
                        datasets: [{
                            label: 'Total Auditado/Glosado (R$)',
                            data: dataG.length > 0 ? dataG : [0],
                            backgroundColor: '#ef4444',
                            borderRadius: 6
                        }]
                    },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false,
                        onClick: (evt, elements) => {
                            if (elements.length > 0) {

        function mapearEventosInjetados() {
            document.getElementById('form-conciliacao').addEventListener('submit', (e) => {
                e.preventDefault();
                let db = JSON.parse(localStorage.getItem('db.json')) || { ultimas_contas: [] };
                
                const novaConta = {
                    timestamp: document.getElementById('conta-timestamp').value || 'ts_' + Date.now(),
                    competencia: document.getElementById('form-competencia').value,
                    prestador: document.getElementById('form-prestador').value.toUpperCase(),
                    setor: document.getElementById('form-setor').value.toUpperCase() || 'GERAL',
                    grupo: document.getElementById('form-grupo').value.toUpperCase() || 'GERAL',
                    valor_faturado: parseFloat(document.getElementById('form-faturado').value) || 0,
                    valor_auditado: parseFloat(document.getElementById('form-auditado').value) || 0,
                    valor_matmed_total: parseFloat(document.getElementById('form-matmed-total').value) || 0,
                    atraso: parseInt(document.getElementById('form-atraso').value) || 0,
                    status: document.getElementById('form-status').value
                };

                const idx = db.ultimas_contas.findIndex(c => c.timestamp === novaConta.timestamp);
                if(idx !== -1) db.ultimas_contas[idx] = novaConta; else db.ultimas_contas.unshift(novaConta);
                
                localStorage.setItem('db.json', JSON.stringify(db));
                limparFormulario(); carregarDadosCompletos();
            });
        }

                localStorage.setItem('monday_standalone_tasks', JSON.stringify(painelTarefas));
                document.getElementById('form-tarefa').reset();
                renderPainelTarefas();
            });
        };

        window.atualizarStatusTarefa = function(id, st) {
            let t = painelTarefas.find(x => x.id === id);
            if(t) { t.status = st; localStorage.setItem('monday_standalone_tasks', JSON.stringify(painelTarefas)); renderPainelTarefas(); }
        };

        window.deleteTaskDirect = function(id) {
            if(confirm("Excluir essa tarefa permanentemente?")) {
                painelTarefas = painelTarefas.filter(x => x.id !== id);
                localStorage.setItem('monday_standalone_tasks', JSON.stringify(painelTarefas));
                renderPainelTarefas();
            }
        };

        function calculateTaskMetrics() {
            const tot = painelTarefas.length; 
            const done = painelTarefas.filter(t => t.status === 'done').length;
            const stuck = painelTarefas.filter(t => t.status === 'stuck').length;
            const pct = tot > 0 ? Math.round((done / tot) * 100) : 0;
            if(document.getElementById('kpi-task-total')) document.getElementById('kpi-task-total').innerText = tot;
            if(document.getElementById('kpi-task-stuck')) document.getElementById('kpi-task-stuck').innerText = stuck;
            if(document.getElementById('kpi-task-progress')) document.getElementById('kpi-task-progress').innerText = `${pct}%`;
            if(document.getElementById('txt-gauge-task-progress')) document.getElementById('txt-gauge-task-progress').innerText = `${pct}%`;
        }

        function initTaskCharts() {
            if(!document.getElementById('gaugeTaskProgress')) return;
            gaugeTaskProgress = new Chart(document.getElementById('gaugeTaskProgress').getContext('2d'), { type: 'doughnut', data: { datasets: [{ data: [0, 100], backgroundColor: ['#00c875', '#e2e8f0'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, rotation: -90, circumference: 180, cutout: '80%' } });
            chartTaskProdutividade = new Chart(document.getElementById('chartTaskProdutividade').getContext('2d'), { type: 'bar', data: { labels: ['Ana', 'Carlos', 'Robson'], datasets: [{ data: [1, 1, 1], backgroundColor: '#0284c7' }] }, options: { responsive: true, maintainAspectRatio: false } });
            chartTaskInstancia = new Chart(document.getElementById('chartTaskInstancia').getContext('2d'), { type: 'doughnut', data: { labels: ['1ª Inst.', '2ª Inst.', '3ª Inst.'], datasets: [{ data: [1, 1, 1], backgroundColor: ['#0284c7', '#0f766e', '#1e1b4b'] }] }, options: { responsive: true, maintainAspectRatio: false } });
        }

        function updateTaskCharts() {
            if(!gaugeTaskProgress) return;
            const tot = painelTarefas.length; const done = painelTarefas.filter(t => t.status === 'done').length;
            gaugeTaskProgress.data.datasets[0].data = [done, Math.max(0, tot - done)]; gaugeTaskProgress.update();
        }

        window.exportarJson = function() { const db = JSON.parse(localStorage.getItem('db.json')); const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'db.json'; a.click(); };
        window.processarImportacaoJson = function(e) { const f = e.target.files[0]; if (!f) return; const reader = new FileReader(); reader.onload = function(evt) { try { const parsed = JSON.parse(evt.target.result); if(parsed && parsed.ultimas_contas) { localStorage.setItem('db.json', JSON.stringify(parsed)); carregarDadosCompletos(); alert('Dados importados!'); } }catch(err){alert('Arquivo inválido.');} }; reader.readAsText(f); };
    </script>
</body>
</html>
